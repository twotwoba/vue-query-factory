name: Publish to npm

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            dry_run:
                description: 'Dry run (不实际发布)'
                required: false
                default: false
                type: boolean

jobs:
    publish:
        name: Publish Package
        runs-on: ubuntu-latest

        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: pnpm

            - name: Upgrade npm for OIDC support
              run: npm install -g npm@latest

            - name: Verify npm version
              run: npm --version

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm run build && pnpm run build:types

            - name: Publish to npm (Dry Run)
              if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
              run: npm publish --dry-run --access public

            - name: Publish to npm
              if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true') }}
              run: npm publish --access public --provenance

            - name: Create publish summary
              run: |
                  echo "## Package Published!" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "**Package:** \`vue-query-factory\`" >> $GITHUB_STEP_SUMMARY
                  echo "**Version:** \`$(node -p "require('./package.json').version")\`" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "### Install" >> $GITHUB_STEP_SUMMARY
                  echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
                  echo "pnpm add vue-query-factory" >> $GITHUB_STEP_SUMMARY
                  echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
